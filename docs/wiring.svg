<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="WenQuanYi Zen Hei, sans-serif">
  <rect width="1240" height="840" fill="#f7f5f0"/>
  <text x="30" y="38" font-size="24" font-weight="bold" fill="#222">리모컨 도어락 배선도 (Arduino Uno)</text>
  <g transform="translate(0,50)">
  <g font-size="13" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="665" y="4">① 서보 SG90</text><text x="665" y="22" fill="#666" font-weight="normal">→ D9</text>
    <text x="820" y="4">② 부저</text><text x="820" y="22" fill="#666" font-weight="normal">→ D8</text>
    <text x="910" y="4">③ 빨강 LED</text><text x="910" y="22" fill="#666" font-weight="normal">→ D6</text>
    <text x="1010" y="4">④ 초록 LED</text><text x="1010" y="22" fill="#666" font-weight="normal">→ D5</text>
    <text x="1115" y="4">⑤ IR 수신기</text><text x="1115" y="22" fill="#666" font-weight="normal">→ D2</text>
  </g>
  <g font-size="14" fill="#333">
    <rect x="30" y="0" width="480" height="270" rx="10" fill="#fff" stroke="#ddd"/>
    <text x="50" y="30" font-size="16" font-weight="bold">선 색깔 안내</text>
    <line x1="50" y1="58" x2="90" y2="58" stroke="#f08c00" stroke-width="5"/><text x="100" y="63">D9 → 서보 신호선(주황)</text>
    <line x1="50" y1="88" x2="90" y2="88" stroke="#9b59b6" stroke-width="5"/><text x="100" y="93">D8 → 부저 + 다리</text>
    <line x1="50" y1="118" x2="90" y2="118" stroke="#e03131" stroke-width="5"/><text x="100" y="123">D6 → 220Ω → 빨강 LED 긴 다리(+)</text>
    <line x1="50" y1="148" x2="90" y2="148" stroke="#2f9e44" stroke-width="5"/><text x="100" y="153">D5 → 220Ω → 초록 LED 긴 다리(+)</text>
    <line x1="50" y1="178" x2="90" y2="178" stroke="#e8a400" stroke-width="5"/><text x="100" y="183">D2 → IR 수신기 OUT</text>
    <line x1="50" y1="208" x2="90" y2="208" stroke="#d62828" stroke-width="5"/><text x="100" y="213">5V → 서보 빨강선, IR VCC</text>
    <line x1="50" y1="238" x2="90" y2="238" stroke="#1d4ed8" stroke-width="5"/><text x="100" y="243">GND → 서보 갈색선, LED 짧은 다리, 부저 −, IR GND</text>
  </g>
  <!-- rails -->
  <rect x="590" y="242" width="600" height="36" rx="4" fill="#fff" stroke="#ccc"/>
  <line x1="600" y1="250" x2="1180" y2="250" stroke="#d62828" stroke-width="4"/>
  <line x1="600" y1="270" x2="1160" y2="270" stroke="#1d4ed8" stroke-width="4"/>
  <text x="700" y="238" font-size="12" fill="#d62828">+5V 레일</text>
  <text x="700" y="296" font-size="12" fill="#1d4ed8">GND 레일</text>

  <!-- ===== Arduino board ===== -->
  <rect x="80" y="340" width="520" height="340" rx="14" fill="#0e7c9b" stroke="#075a71" stroke-width="3"/>
  <rect x="50" y="390" width="80" height="60" rx="4" fill="#c9ced4" stroke="#8a9199" stroke-width="2"/>
  <text x="90" y="478" font-size="12" fill="#fff" text-anchor="middle">USB</text>
  <rect x="55" y="580" width="60" height="60" rx="4" fill="#222"/>
  <text x="140" y="620" font-size="12" fill="#fff">DC 7~12V</text>
  <rect x="320" y="520" width="210" height="44" rx="3" fill="#1b1b1b"/>
  <g fill="#bbb"><rect x="330" y="512" width="6" height="8"/><rect x="350" y="512" width="6" height="8"/><rect x="370" y="512" width="6" height="8"/><rect x="390" y="512" width="6" height="8"/><rect x="410" y="512" width="6" height="8"/><rect x="430" y="512" width="6" height="8"/><rect x="450" y="512" width="6" height="8"/><rect x="470" y="512" width="6" height="8"/><rect x="490" y="512" width="6" height="8"/><rect x="510" y="512" width="6" height="8"/>
  <rect x="330" y="564" width="6" height="8"/><rect x="350" y="564" width="6" height="8"/><rect x="370" y="564" width="6" height="8"/><rect x="390" y="564" width="6" height="8"/><rect x="410" y="564" width="6" height="8"/><rect x="430" y="564" width="6" height="8"/><rect x="450" y="564" width="6" height="8"/><rect x="470" y="564" width="6" height="8"/><rect x="490" y="564" width="6" height="8"/><rect x="510" y="564" width="6" height="8"/></g>
  <text x="425" y="547" font-size="13" fill="#ddd" text-anchor="middle">ATmega328P</text>
  <text x="300" y="470" font-size="30" font-weight="bold" fill="#fff">ARDUINO UNO</text>
  <!-- digital header -->
  <rect x="216" y="348" width="366" height="20" fill="#1b1b1b"/>
  <g font-size="10" fill="#fff" text-anchor="middle">
    <text x="230" y="384">13</text><text x="256" y="384">12</text><text x="282" y="384">11</text><text x="308" y="384">10</text><text x="334" y="384">9</text><text x="360" y="384">8</text><text x="386" y="384">7</text><text x="412" y="384">6</text><text x="438" y="384">5</text><text x="464" y="384">4</text><text x="490" y="384">3</text><text x="516" y="384">2</text><text x="542" y="384">1</text><text x="568" y="384">0</text>
  </g>
  <text x="400" y="400" font-size="11" fill="#cde" text-anchor="middle">DIGITAL (PWM~)</text>
  <g fill="#666"><circle cx="230" cy="358" r="4"/><circle cx="256" cy="358" r="4"/><circle cx="282" cy="358" r="4"/><circle cx="308" cy="358" r="4"/><circle cx="386" cy="358" r="4"/><circle cx="464" cy="358" r="4"/><circle cx="490" cy="358" r="4"/><circle cx="542" cy="358" r="4"/><circle cx="568" cy="358" r="4"/></g>
  <!-- power header -->
  <rect x="190" y="652" width="150" height="20" fill="#1b1b1b"/>
  <rect x="380" y="652" width="166" height="20" fill="#1b1b1b"/>
  <g font-size="10" fill="#fff" text-anchor="middle">
    <text x="204" y="644">3.3V</text><text x="230" y="644">5V</text><text x="256" y="644">GND</text><text x="282" y="644">GND</text><text x="308" y="644">VIN</text>
    <text x="398" y="644">A0</text><text x="424" y="644">A1</text><text x="450" y="644">A2</text><text x="476" y="644">A3</text><text x="502" y="644">A4</text><text x="528" y="644">A5</text>
  </g>
  <g fill="#666"><circle cx="204" cy="662" r="4"/><circle cx="282" cy="662" r="4"/><circle cx="308" cy="662" r="4"/><circle cx="398" cy="662" r="4"/><circle cx="424" cy="662" r="4"/><circle cx="450" cy="662" r="4"/><circle cx="476" cy="662" r="4"/><circle cx="502" cy="662" r="4"/><circle cx="528" cy="662" r="4"/></g>

  <!-- ===== power wires ===== -->
  <polyline points="230,662 230,720 1170,720 1170,250" fill="none" stroke="#d62828" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="256,662 256,705 1150,705 1150,270" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linejoin="round"/>
  <text x="700" y="740" font-size="13" fill="#d62828">5V → +5V 레일</text>
  <text x="700" y="698" font-size="13" fill="#1d4ed8">GND → GND 레일</text>

  <!-- ===== Servo (D9) ===== -->
  <rect x="610" y="60" width="110" height="70" rx="6" fill="#1f4e9c" stroke="#123266" stroke-width="2"/>
  <rect x="598" y="78" width="134" height="12" rx="3" fill="#1f4e9c" stroke="#123266"/>
  <circle cx="645" cy="95" r="16" fill="#e9e9e9" stroke="#999"/>
  <path d="M645 95 L645 42" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <path d="M645 95 L645 42" stroke="#ddd" stroke-width="10" stroke-linecap="round"/>
  <circle cx="645" cy="95" r="5" fill="#888"/>
  <text x="690" y="120" font-size="11" fill="#fff" text-anchor="middle">SG90</text>
  <path d="M650 130 C650 160 650 170 650 190" stroke="#7b4a24" stroke-width="4" fill="none"/>
  <path d="M665 130 C665 160 665 170 665 190" stroke="#d62828" stroke-width="4" fill="none"/>
  <path d="M680 130 C680 160 680 170 680 190" stroke="#f08c00" stroke-width="4" fill="none"/>
  <text x="645" y="182" font-size="10" fill="#7b4a24" text-anchor="end">갈색</text><text x="690" y="160" font-size="10" fill="#f08c00">주황=신호</text>
  <line x1="650" y1="190" x2="650" y2="270" stroke="#7b4a24" stroke-width="3"/><circle cx="650" cy="270" r="5" fill="#111"/>
  <line x1="665" y1="190" x2="665" y2="250" stroke="#d62828" stroke-width="3"/><circle cx="665" cy="250" r="5" fill="#111"/>
  <polyline points="680,190 680,290 334,290 334,358" fill="none" stroke="#f08c00" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- ===== Buzzer (D8) ===== -->
  <circle cx="820" cy="100" r="34" fill="#222"/>
  <circle cx="820" cy="100" r="7" fill="#555"/>
  <text x="790" y="62" font-size="14" fill="#d62828" font-weight="bold">+</text>
  <line x1="800" y1="130" x2="800" y2="300" stroke="#9b59b6" stroke-width="3.5"/>
  <line x1="840" y1="130" x2="840" y2="270" stroke="#333" stroke-width="3"/><circle cx="840" cy="270" r="5" fill="#111"/>
  <polyline points="800,300 360,300 360,358" fill="none" stroke="#9b59b6" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- ===== Red LED (D6) ===== -->
  <path d="M893 120 L893 72 A17 17 0 0 1 927 72 L927 120 Z" fill="#ff4d4d" opacity="0.9" stroke="#a00"/>
  <rect x="889" y="118" width="42" height="6" fill="#ff4d4d" stroke="#a00"/>
  <line x1="900" y1="124" x2="900" y2="176" stroke="#999" stroke-width="2.5"/>
  <line x1="920" y1="124" x2="920" y2="166" stroke="#999" stroke-width="2.5"/>
  <text x="884" y="150" font-size="10" fill="#555">+</text><text x="926" y="150" font-size="10" fill="#555">−</text>
  <rect x="893" y="176" width="14" height="40" rx="5" fill="#e8d3a8" stroke="#a08850"/>
  <rect x="893" y="184" width="14" height="3" fill="#d62828"/><rect x="893" y="191" width="14" height="3" fill="#d62828"/><rect x="893" y="198" width="14" height="3" fill="#7b4a24"/><rect x="893" y="207" width="14" height="3" fill="#c9a227"/>
  <text x="888" y="200" font-size="10" fill="#555" text-anchor="end">220Ω</text>
  <line x1="920" y1="166" x2="920" y2="270" stroke="#333" stroke-width="3"/><circle cx="920" cy="270" r="5" fill="#111"/>
  <polyline points="900,216 900,310 412,310 412,358" fill="none" stroke="#e03131" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- ===== Green LED (D5) ===== -->
  <path d="M993 120 L993 72 A17 17 0 0 1 1027 72 L1027 120 Z" fill="#40c057" opacity="0.9" stroke="#2b8a3e"/>
  <rect x="989" y="118" width="42" height="6" fill="#40c057" stroke="#2b8a3e"/>
  <line x1="1000" y1="124" x2="1000" y2="176" stroke="#999" stroke-width="2.5"/>
  <line x1="1020" y1="124" x2="1020" y2="166" stroke="#999" stroke-width="2.5"/>
  <text x="984" y="150" font-size="10" fill="#555">+</text><text x="1026" y="150" font-size="10" fill="#555">−</text>
  <rect x="993" y="176" width="14" height="40" rx="5" fill="#e8d3a8" stroke="#a08850"/>
  <rect x="993" y="184" width="14" height="3" fill="#d62828"/><rect x="993" y="191" width="14" height="3" fill="#d62828"/><rect x="993" y="198" width="14" height="3" fill="#7b4a24"/><rect x="993" y="207" width="14" height="3" fill="#c9a227"/>
  <line x1="1020" y1="166" x2="1020" y2="270" stroke="#333" stroke-width="3"/><circle cx="1020" cy="270" r="5" fill="#111"/>
  <polyline points="1000,216 1000,320 438,320 438,358" fill="none" stroke="#2f9e44" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- ===== IR receiver (D2) ===== -->
  <rect x="1090" y="62" width="50" height="58" rx="4" fill="#2a2a2a"/>
  <circle cx="1115" cy="86" r="15" fill="#111" stroke="#555" stroke-width="2"/>
  <circle cx="1110" cy="81" r="4" fill="#666"/>
  <line x1="1100" y1="120" x2="1100" y2="190" stroke="#aaa" stroke-width="2.5"/>
  <line x1="1115" y1="120" x2="1115" y2="190" stroke="#aaa" stroke-width="2.5"/>
  <line x1="1130" y1="120" x2="1130" y2="190" stroke="#aaa" stroke-width="2.5"/>
  <g font-size="9" fill="#333" text-anchor="middle"><text x="1100" y="140" transform="rotate(-90 1100 140)" dx="-4" dy="-6">OUT</text><text x="1115" y="140" transform="rotate(-90 1115 140)" dx="-4" dy="-6">GND</text><text x="1130" y="140" transform="rotate(-90 1130 140)" dx="-4" dy="-6">VCC</text></g>
  <line x1="1115" y1="190" x2="1115" y2="270" stroke="#333" stroke-width="3"/><circle cx="1115" cy="270" r="5" fill="#111"/>
  <line x1="1130" y1="190" x2="1130" y2="250" stroke="#d62828" stroke-width="3"/><circle cx="1130" cy="250" r="5" fill="#111"/>
  <polyline points="1100,190 1100,330 516,330 516,358" fill="none" stroke="#e8a400" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- remote -->
  <g transform="translate(1185,60) rotate(12)">
    <rect x="0" y="0" width="40" height="110" rx="8" fill="#333"/>
    <circle cx="20" cy="14" r="5" fill="#e03131"/>
    <g fill="#ccc"><circle cx="11" cy="34" r="4"/><circle cx="20" cy="34" r="4"/><circle cx="29" cy="34" r="4"/><circle cx="11" cy="46" r="4"/><circle cx="20" cy="46" r="4"/><circle cx="29" cy="46" r="4"/><circle cx="11" cy="58" r="4"/><circle cx="20" cy="58" r="4"/><circle cx="29" cy="58" r="4"/><circle cx="20" cy="72" r="4"/></g>
  </g>
  <path d="M1182 92 Q1165 85 1150 90" stroke="#e03131" stroke-width="2" fill="none" stroke-dasharray="4 3"/>

  <!-- used pin highlights -->
  <g stroke="#fff" stroke-width="2">
    <circle cx="334" cy="358" r="5" fill="#f08c00"/><circle cx="360" cy="358" r="5" fill="#9b59b6"/><circle cx="412" cy="358" r="5" fill="#e03131"/><circle cx="438" cy="358" r="5" fill="#2f9e44"/><circle cx="516" cy="358" r="5" fill="#e8a400"/>
    <circle cx="230" cy="662" r="5" fill="#d62828"/><circle cx="256" cy="662" r="5" fill="#1d4ed8"/>
  </g>
  </g>
</svg>
