<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>흔들어 열기</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --fg:#f1f5f9; --mute:#94a3b8; --ok:#22c55e; --bad:#ef4444; --acc:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         background:var(--bg); color:var(--fg); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .sub { color:var(--mute); margin:0 0 20px; font-size:.9rem; }
  .card { background:var(--card); border-radius:16px; padding:20px; width:100%; max-width:420px; margin-bottom:16px; }
  .lock { font-size:5rem; text-align:center; transition:transform .2s; }
  .lock.shake { animation:sh .4s; }
  @keyframes sh { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-15deg)} 75%{transform:rotate(15deg)} }
  #status { text-align:center; font-size:1.2rem; font-weight:600; margin:8px 0 0; }
  .bar { height:10px; background:#334155; border-radius:5px; overflow:hidden; margin:14px 0 4px; }
  .bar > div { height:100%; width:0; background:var(--acc); transition:width .1s; }
  .hint { color:var(--mute); font-size:.85rem; text-align:center; }
  button { width:100%; padding:14px; font-size:1rem; font-weight:600; border:0; border-radius:12px; background:var(--acc); color:#fff; margin-top:10px; }
  button.secondary { background:#334155; }
  button:disabled { opacity:.5; }
  label { display:block; font-size:.9rem; color:var(--mute); margin-top:12px; }
  input { width:100%; padding:12px; font-size:1rem; border-radius:10px; border:1px solid #334155; background:#0f172a; color:var(--fg); margin-top:6px; }
  input[type=range] { padding:0; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  #log { font-family:ui-monospace,monospace; font-size:.75rem; color:var(--mute); max-height:120px; overflow:auto; white-space:pre-wrap; }
</style>
</head>
<body>
  <h1>📱 흔들어서 문 열기</h1>
  <p class="sub">리빙랩 · 스마트 도어락</p>

  <div class="card">
    <div class="lock" id="lockIcon">🔒</div>
    <p id="status">연결되지 않음</p>
    <div class="bar"><div id="meter"></div></div>
    <p class="hint" id="hint">아래 [도어락 연결]을 눌러 주세요</p>
    <button id="connectBtn">도어락 연결</button>
    <button id="manualBtn" class="secondary" disabled>버튼으로 열기</button>
  </div>

  <div class="card">
    <label>PIN (도어락에 설정한 값)
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="예: 1234">
    </label>
    <label>흔들기 민감도 <span id="sensVal"></span>
      <input id="sens" type="range" min="10" max="30" step="1" value="18">
    </label>
    <label>필요한 흔들기 횟수 <span id="cntVal"></span>
      <input id="cnt" type="range" min="1" max="6" step="1" value="3">
    </label>
  </div>

  <div class="card"><div id="log"></div></div>

<script>
const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dc4a10";
const CMD_UUID     = "6e400002-b5a3-f393-e0a9-e50e24dc4a10";
const STATUS_UUID  = "6e400003-b5a3-f393-e0a9-e50e24dc4a10";

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

let device = null, cmdChar = null, motionOn = false, sending = false;
let peaks = [], lastPeak = 0, lastSent = 0;

// ---------- 설정 ----------
$("pin").value  = store.get("pin", "");
$("sens").value = store.get("sens", "18");
$("cnt").value  = store.get("cnt", "3");
const showSettings = () => { $("sensVal").textContent = `(${$("sens").value} m/s²)`; $("cntVal").textContent = `(${$("cnt").value}회)`; };
showSettings();
["pin","sens","cnt"].forEach(id => $(id).addEventListener("input", () => { store.set(id, $(id).value); showSettings(); }));

function log(msg) {
  const t = new Date().toLocaleTimeString();
  $("log").textContent = `[${t}] ${msg}\n` + $("log").textContent;
}
function setStatus(text, cls = "") {
  $("status").textContent = text;
  $("status").className = cls;
}

// ---------- 흔들기 감지 ----------
function onMotion(e) {
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a || a.x == null) return;
  // 중력(약 9.8)을 뺀 순수 움직임 크기
  const mag = Math.abs(Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z) - 9.81);
  const th = Number($("sens").value);
  $("meter").style.width = Math.min(100, mag / th * 100) + "%";

  const now = Date.now();
  if (mag > th && now - lastPeak > 150) {        // 한 번 흔들 때 여러 번 세지 않도록 150ms 간격
    lastPeak = now;
    peaks.push(now);
    peaks = peaks.filter(t => now - t < 1200);   // 1.2초 안의 흔들기만 인정
    $("lockIcon").classList.remove("shake"); void $("lockIcon").offsetWidth; $("lockIcon").classList.add("shake");
    if (peaks.length >= Number($("cnt").value)) {
      peaks = [];
      openDoor("shake");
    }
  }
}

async function enableMotion() {
  if (motionOn) return true;
  if (typeof DeviceMotionEvent === "undefined") { log("이 기기는 가속도 센서를 지원하지 않습니다"); return false; }
  // iOS 13+ 는 사용자 허락 필요
  if (typeof DeviceMotionEvent.requestPermission === "function") {
    try {
      const r = await DeviceMotionEvent.requestPermission();
      if (r !== "granted") { log("동작 센서 권한 거부됨"); return false; }
    } catch (err) { log("센서 권한 오류: " + err.message); return false; }
  }
  window.addEventListener("devicemotion", onMotion);
  motionOn = true;
  log("흔들기 감지 시작");
  return true;
}

// ---------- BLE ----------
async function connect() {
  // iOS 센서 권한은 버튼 클릭 직후에 요청해야 하므로 먼저 실행
  await enableMotion();

  if (!navigator.bluetooth) {
    setStatus("이 브라우저는 블루투스를 지원하지 않음", "bad");
    log("Android: Chrome 사용 / iPhone: 'Bluefy' 브라우저 앱 사용");
    return;
  }
  try {
    setStatus("도어락 찾는 중…");
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
    device.addEventListener("gattserverdisconnected", onDisconnected);
    await gattConnect();
  } catch (err) {
    setStatus("연결 실패", "bad");
    log(err.message);
  }
}

async function gattConnect() {
  const server  = await device.gatt.connect();
  const service = await server.getPrimaryService(SERVICE_UUID);
  cmdChar = await service.getCharacteristic(CMD_UUID);
  const st = await service.getCharacteristic(STATUS_UUID);
  await st.startNotifications();
  st.addEventListener("characteristicvaluechanged", e => onStatus(new TextDecoder().decode(e.target.value)));
  setStatus("연결됨 · 폰을 흔드세요", "ok");
  $("hint").textContent = `폰을 ${$("cnt").value}번 세게 흔들면 문이 열립니다`;
  $("connectBtn").textContent = "다시 연결";
  $("manualBtn").disabled = false;
  log("연결됨: " + (device.name || "ShakeLock"));
  if ("vibrate" in navigator) navigator.vibrate(50);
}

async function onDisconnected() {
  cmdChar = null;
  $("manualBtn").disabled = true;
  setStatus("연결 끊김 · 재연결 중…", "bad");
  for (let i = 0; i < 3; i++) {
    try { await new Promise(r => setTimeout(r, 1000)); await gattConnect(); return; } catch {}
  }
  setStatus("연결 끊김", "bad");
}

function onStatus(msg) {
  log("도어락: " + msg);
  if (msg === "OPEN") {
    $("lockIcon").textContent = "🔓";
    setStatus("문이 열렸습니다", "ok");
    if ("vibrate" in navigator) navigator.vibrate([100, 50, 100]);
  } else if (msg === "LOCKED") {
    $("lockIcon").textContent = "🔒";
    setStatus("연결됨 · 폰을 흔드세요", "ok");
  } else if (msg.startsWith("DENIED")) {
    setStatus(`PIN이 틀립니다 (남은 시도 ${msg.split(":")[1]})`, "bad");
  } else if (msg.startsWith("LOCKOUT")) {
    setStatus(`오류 초과 · ${msg.split(":")[1]}초 후 재시도`, "bad");
  } else if (msg === "COOLDOWN") {
    setStatus("잠시 후 다시 시도하세요");
  }
}

async function openDoor(source) {
  const now = Date.now();
  if (sending || now - lastSent < 2000) return;
  if (!cmdChar) { setStatus("먼저 도어락을 연결하세요", "bad"); return; }
  const pin = $("pin").value.trim();
  if (!pin) { setStatus("PIN을 입력하세요", "bad"); return; }
  sending = true; lastSent = now;
  try {
    await cmdChar.writeValue(new TextEncoder().encode("OPEN:" + pin));
    log(`열기 요청 보냄 (${source === "shake" ? "흔들기" : "버튼"})`);
  } catch (err) {
    log("전송 실패: " + err.message);
  } finally {
    sending = false;
  }
}

$("connectBtn").addEventListener("click", connect);
$("manualBtn").addEventListener("click", () => openDoor("button"));

if (!window.isSecureContext) log("⚠ HTTPS 주소에서 열어야 센서/블루투스가 동작합니다");
</script>
</body>
</html>
